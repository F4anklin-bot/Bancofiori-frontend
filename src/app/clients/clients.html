<div class="h-full w-full dark:text-white bg-linear-to-b from-[#1a1a2e] to-[#090912]">
    <div class="w-full flex justify-between">
        <div class="ml-10 m-5 p-4 flex flex-col gap-3">
            <h1 class="text-4xl dark:text-white font-bold">Clients</h1>
            <p class="text-md text-gray-400">Gérez les clients</p>
        </div>
        <div class="m-10 p-2">
            <button class="flex text-lg font-bold text-white bg-linear-to-tr from-green-500 to-green-600 p-3 cursor-pointer rounded-2xl items-center hover:from-green-600 hover:to-green-700 shadow-lg shadow-green-600/30 hover:shadow-green-700/40 transition-all duration-200">
                <ng-icon 
                    size="28" 
                    name="bootstrapPlus"
                    class="mr-2"
                />
                Nouveau client
            </button>
        </div>
    </div>

    <!-- Rechercher et filtrer les clients -->
    <div class="m-5 flex justify-center items-center p-6 bg-linear-to-r from-violet-950/10 to-violet-d/15 border border-gray-800 rounded-3xl relative">
        <ng-icon
        name="bootstrapSearch"
        size="20"
        class="absolute left-10 text-gray-600 pointer-events-none"
        />
        <input 
        type="search" 
        name="search" 
        id="search" 
        placeholder="Rechercher un client"
        class="w-full bg-transparent pl-15 border-2 border-gray-600 focus:ring-0 rounded-2xl p-4 focus:outline-none focus:border-green-400 placeholder-gray-400 text-white text-lg"
        >
    </div>
</div>
